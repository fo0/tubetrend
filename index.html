<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/icon.svg" />
    <title>TubeTrend</title>
    <!-- Apply theme class (dark/light) before React mounts to avoid FOUC -->
    <script>
      (function () {
        try {
          // Duplicate of STORAGE_KEYS.THEME (src/shared/constants/config.ts). This script runs
          // before the React bundle, so it cannot import the constant. chrome-extension/
          // theme-init.js re-implements this block as an external file (Manifest-V3 CSP forbids
          // inline script); the logic is identical, the text is not, so diff behaviour and not
          // bytes. Renaming the constant without updating BOTH copies stays green in
          // typecheck/build and only shows up as the FOUC flash coming back. Editing anything
          // inside this <script> also changes its CSP hash — update the two script-src
          // 'sha256-...' entries in nginx.conf in the same commit, or the deployed app blocks
          // this script. Sites are listed in agent_docs/api-reference.md.
          var storageKey = "tt.theme";
          var explicit = localStorage.getItem(storageKey);
          var systemPrefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var shouldDark = explicit === "dark" || (explicit !== "light" && systemPrefersDark);
          if (shouldDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
