name: Release

# Builds the Chrome Extension zip and the Android APK and attaches both to a
# GitHub Release. The web app ships separately as a Docker image
# (`docker-publish.yml`).

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "agent_docs/**"
      - ".claude/**"
      - ".env.example"
      - ".gitignore"
      - ".editorconfig"
      - "LICENSE*"
      - ".vscode/**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: only the `release` job creates the GitHub Release and
# uploads assets; it declares `contents: write` itself. The build jobs only
# upload workflow artifacts, and the `quality` gate only reads the checkout.
permissions:
  contents: read

jobs:
  # Code quality gate — the same reusable chain (`quality.yml`) `ci.yml` runs on
  # PRs. Every build job hangs off `prepare`, and `prepare` waits for this gate,
  # so a tree the PR gate would reject (a direct push, an admin merge, a PR
  # whose paths-ignore skipped ci.yml) never builds or cuts a GitHub Release.
  quality:
    uses: ./.github/workflows/quality.yml

  prepare:
    needs: quality
    runs-on: ubuntu-latest
    # Longest of the last 15 successful runs: ~4 s.
    timeout-minutes: 5
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Generate build version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$REF_NAME"
          else
            RELEASE_TAG="v$(date -u +'%Y%m%d.%H%M.0')"
          fi
          BUILD_VERSION="${RELEASE_TAG#v}"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-extension:
    needs: prepare
    runs-on: ubuntu-latest
    # Longest of the last 15 successful runs: ~25 s.
    timeout-minutes: 10
    name: Build Chrome Extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome Extension
        run: npm run build:extension

      - name: Create extension zip
        run: cd dist-extension && zip -r ../tubetrend-chrome-extension.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tubetrend-chrome-extension
          path: tubetrend-chrome-extension.zip
          if-no-files-found: error

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    # Longest of the last 15 successful runs: ~3 min.
    timeout-minutes: 20
    name: Build Android APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        env:
          VERSION: ${{ needs.prepare.outputs.build_version }}
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "TubeTrend-${VERSION}-Android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tubetrend-android
          path: TubeTrend-*-Android.apk
          if-no-files-found: error

  release:
    needs: [prepare, build-extension, build-android]
    # Publish whatever built: one failed target must not withhold the other.
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.build-extension.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    # Longest of the last 15 successful runs: ~50 s.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          echo "Creating release: $TAG for repo: $REPO (target: ${{ github.sha }})"

          # Delete existing release if present (e.g. from a previous failed run)
          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Release $TAG already exists, deleting it first..."
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          fi

          # Create release with auto-generated notes, fall back to simple notes
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --generate-release-notes \
            --title "TubeTrend $TAG" \
          || gh release create "$TAG" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --notes "Release $TAG" \
            --title "TubeTrend $TAG"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          REPO="${{ github.repository }}"
          sleep 3
          find artifacts -type f \
            -exec gh release upload "$TAG" --repo "$REPO" --clobber {} +
