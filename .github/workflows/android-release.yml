name: Android Release

# Dispatch-only. Every push to main already builds the Android APK in
# `release.yml`, uploads it as the workflow artifact `tubetrend-android`
# and attaches it to the GitHub Release — a push trigger here only built the
# same output a second time. This workflow stays as a manual one-off build of
# the Android APK as a workflow artifact, without cutting a release.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: the build job only uploads a workflow artifact and the
# `quality` gate only reads the checkout — neither needs a GITHUB_TOKEN scope
# beyond reading the repository.
permissions:
  contents: read

jobs:
  # Code quality gate — the same reusable chain (`quality.yml`) `ci.yml` runs on
  # PRs, in place of the old inline `tsc --noEmit` step.
  quality:
    uses: ./.github/workflows/quality.yml

  build-apk:
    needs: quality
    runs-on: ubuntu-latest
    # Longest of the last 15 successful runs: ~2 min.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tubetrend-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
