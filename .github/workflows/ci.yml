name: CI

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".env.example"
      - ".gitignore"
      - ".editorconfig"
      - "LICENSE*"
      - ".vscode/**"

# Cancel only a superseded PR run (this workflow runs on pull_request only, so
# today every run is a PR run; the condition keeps any other event uncancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: both jobs only check out the code and run npm (the reusable
# `quality.yml` declares the same scope and cannot exceed this one). Without this
# block the GITHUB_TOKEN inherits the repository default, which can be
# read/write. Every other workflow here already declares its scope.
permissions:
  contents: read

jobs:
  # Format, typecheck, lint and build. The chain itself lives in the reusable
  # `quality.yml`, which the publish/release workflows call as their gate too,
  # so a PR is checked by exactly the steps that gate a publish from `main`.
  checks:
    uses: ./.github/workflows/quality.yml

  # Dependency security audit (no install needed — runs off the lockfile, so
  # setup-node carries no npm cache: there is nothing to restore or save)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # Longest of the last 30 runs: ~20 s.
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
