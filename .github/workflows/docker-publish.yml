name: Docker Publish

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".env.example"
      - ".gitignore"
      - ".editorconfig"
      - "LICENSE*"
      - ".vscode/**"
    # Trigger auch bei Release-Tags (z.B. v20260214-1530)
  workflow_dispatch:

# Without a concurrency group, two pushes to main run two publishes in parallel
# and both race for the `latest` tag in GHCR — whichever finishes last wins,
# which is not necessarily the newer commit. Runs are queued instead of
# cancelled: a running publish always finishes, so a newer push can no longer
# abort it halfway through a push to GHCR. The queue holds at most one pending
# run (the newest), so `latest` still ends on the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: only `build-and-push` pushes to GHCR; it declares
# `packages: write` itself. `check-code` (the reusable `quality.yml`) only
# reads the repository.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Code quality gate before anything is built — the same reusable chain
  # (`quality.yml`) `ci.yml` runs on PRs. This workflow publishes on its own
  # (push to main -> ghcr.io/fo0/tubetrend:latest), so its gate must not be
  # weaker than the PR gate: a commit that reaches main without passing ci.yml
  # — a direct push, an admin merge, or a PR whose paths-ignore skipped it —
  # would otherwise publish an image built from a tree the PR gate rejects.
  check-code:
    uses: ./.github/workflows/quality.yml

  build-and-push:
    # Startet erst, wenn check-code erfolgreich war
    needs: check-code
    runs-on: ubuntu-latest
    # Longest of the last 15 successful runs: ~2 min.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build tag
        id: git_info
        run: echo "build_tag=v$(date -u +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.git_info.outputs.build_tag }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pass git info to Docker build
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          # 2. Caching aktivieren für schnellere Builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
