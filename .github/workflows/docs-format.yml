name: Docs Format

# Counterpart to ci.yml. That workflow carries `paths-ignore: "**.md"`
# so documentation-only PRs don't pay for the full typecheck/lint/build chain —
# but `npm run format:check` is `prettier --check .`, which DOES cover
# Markdown. That left a blind spot: Markdown formatting drift could never fail
# a check, and a docs-only PR could merge a red `format:check` onto main.
#
# This workflow closes exactly that gap and nothing more: it runs on the paths
# ci.yml ignores, and checks only the files Prettier can parse there
# (`*.md`). Deliberately no `npm ci` — Prettier is pinned to the version in
# package.json and fetched standalone, so the gate stays cheap enough to
# justify running on every docs change. It also runs on push to main, which
# ci.yml does not.

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
    paths:
      - "**.md"
  push:
    branches: [main]
    paths:
      - "**.md"

# Cancel only a superseded PR run. A push run on main gets a group of its own
# (its sha): a shared group would let a newer Markdown push cancel the previous
# push's run (and GitHub keeps at most one PENDING run per group, whatever
# cancel-in-progress says), leaving that commit without a verdict.
concurrency:
  group: docs-format-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job only checks out the code and runs Prettier. Without
# this block the GITHUB_TOKEN inherits the repository default, which can be
# read/write. Every other workflow here already declares its scope.
permissions:
  contents: read

jobs:
  format:
    name: Prettier (Markdown)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Read the pinned version out of package.json rather than hardcoding it,
      # so this job can never drift from the Prettier `npm run format` applies.
      # The value is narrowed to a semver here: this workflow runs on
      # `pull_request`, so `package.json` is the PR's (fork-authored) content,
      # and an unconstrained string could inject further lines into
      # `$GITHUB_OUTPUT` or flow on into the next step.
      - name: Resolve pinned Prettier version
        id: prettier
        run: |
          version=$(node -p "(/[0-9][0-9A-Za-z.+-]*/.exec(require('./package.json').devDependencies.prettier)||[''])[0]")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The version reaches the shell through `env`, never as `${{ }}` inline in
      # `run`: an inline expression is substituted before the shell parses the
      # script, and on a fork PR `package.json` is PR-authored content.
      - name: Check Markdown formatting
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check "**/*.md"
        env:
          PRETTIER_VERSION: ${{ steps.prettier.outputs.version }}
